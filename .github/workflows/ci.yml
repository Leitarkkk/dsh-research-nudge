name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run

  dsh-smoke:
    name: Real DSH smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pnpm and real DSH CLI
        run: |
          npm install -g pnpm@10 @deepseek-ai/dsh@0.1.0-rc.7
          pnpm --version
          dsh --help >/dev/null
      - name: Install plugin into DSH profile
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/dsh-home"
          mkdir -p "$HOME"
          timeout 90s dsh plugin --profile web add "$GITHUB_WORKSPACE"
      - name: Verify composed DSH config
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/dsh-home"
          timeout 60s dsh --profile web --dump-config | tee "$RUNNER_TEMP/dsh-config.txt"
          grep -q "research-nudge" "$RUNNER_TEMP/dsh-config.txt"
      - name: Boot real DSH web runtime
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/dsh-home"
          dsh --profile web web --no-open >"$RUNNER_TEMP/dsh-web.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/dsh-web.log"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3080/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/dsh-web.log"
          test "$ready" -eq 1
