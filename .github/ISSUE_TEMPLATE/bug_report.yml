name: Bug report
description: Report reproducible incorrect behavior in dsh-research-nudge.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Remove secrets and private workspace content from logs.
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.1.0-rc.7
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, DSH profile, and installation method.
      placeholder: Windows 11, Node 24.x, web profile, GitHub install
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Include the smallest sequence of tool results and configuration that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets and private workspace content.
          required: true
        - label: I checked for an existing issue.
          required: true
